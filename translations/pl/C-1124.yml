label: Data podania szczepionki przeciwko RSV matce w czasie ciąży
description: Vaccinating a pregnant woman with the RSV vaccine (Abrysvo) protects the infant against RSV bronchiolitis through the transplacental transfer of anti-RSV antibodies. If the baby is born within 14 days of vaccination or in the event of a premature birth, catch-up passive immunisation with monoclonal antibodies is recommended.
