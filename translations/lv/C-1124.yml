label: "Mātes, kuras grūtniecības laikā vakcinētas pret RSV: vakcinācijas datums"
description: Grūtnieces vakcinēšana ar RSV vakcīnu (Abrysvo) ļauj aizsargāt zīdaini pret RSV bronhiolītu, pateicoties RSV antivielu pārnesei caur placentu. Ja dzemdības notiek mazāk nekā 14 dienas pēc vakcinācijas vai ja notiek priekšlaicīgas dzemdības, ieteicams veikt papildu pasīvo imunitāti, izmantojot monoklonālos antivielu preparātus.
